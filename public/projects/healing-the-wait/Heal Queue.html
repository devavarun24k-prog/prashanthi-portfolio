<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heal Queue — Variation 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
<style>
:root{--bg:#DCEBF4;--ink:#002F42;--mute:#3f6577;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071b24;--ink:#dcebf4;--mute:#9EC5DD}}
:root[data-theme="dark"]{--bg:#071b24;--ink:#dcebf4;--mute:#9EC5DD}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,"Noto Sans Devanagari","Noto Sans Kannada",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #7FCCC4;outline-offset:2px}
.top{display:flex;gap:10px;justify-content:center;padding:20px 16px 0}
.top button{border:1px solid var(--mute);background:none;border-radius:999px;padding:8px 18px;min-height:44px}
.stage{display:flex;justify-content:center;padding:20px 16px 48px}
.ph{width:100%;max-width:380px;height:740px;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(175deg,#002F42 0%,#005E85 70%,#153579 100%);color:#fff;box-shadow:0 24px 50px -28px #000a}
.ph.big{font-size:118%}
.hd{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px;gap:8px}
.hd b{font-weight:600;font-size:1.05em}
.lg{display:flex;gap:4px;background:#ffffff1f;border-radius:999px;padding:3px}
.lg button{border:0;background:none;color:#fff;border-radius:999px;padding:4px 11px;min-height:36px}
.lg button[aria-pressed="true"]{background:#7FCCC4;color:#002F42;font-weight:600}
.sc{flex:1;overflow:auto;padding:6px 20px 22px}
h2{margin:6px 0 14px;font-size:1.5em;font-weight:600}
.bk{display:inline-flex;align-items:center;gap:6px;border:0;background:#ffffff1f;border-radius:999px;padding:8px 16px;min-height:44px;margin:4px 0 10px;color:#fff}
.rw{position:relative;width:210px;height:210px;margin:6px auto}
svg{width:100%;height:100%;transform:rotate(-90deg)}
circle{fill:none;stroke-width:13;stroke-linecap:round}
.tr{stroke:#ffffff26}.pr{stroke:#7FCCC4;transition:stroke-dashoffset .8s}
.mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.mid b{font-size:4.2rem;font-weight:600;line-height:1}
.mid span{color:#9EC5DD}
.bub{background:#ffffff1c;border-radius:22px 22px 22px 6px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;background:#7FCCC4;color:#002F42;border-radius:999px;padding:13px 10px;min-height:50px;font-weight:600}
.btn.o{background:none;color:#fff;border:2px solid #ffffff66}
.btn:disabled{background:#ffffff26;color:#dcebf4}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{border:0;text-align:left;background:#ffffff1c;border-radius:20px;padding:14px;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.tile i{font-style:normal;font-size:1.5rem}
.tile.k{background:#9EC5DD;color:#002F42}
.card{background:#ffffff1c;border-radius:20px;padding:14px 16px;margin:10px 0}
.ch{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.ch button{border:2px solid #ffffff55;background:none;border-radius:999px;padding:8px 14px;min-height:44px}
.ch button[aria-pressed="true"]{background:#9EC5DD;border-color:#9EC5DD;color:#002F42;font-weight:600}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #ffffff26}
.ln:last-child{border:0}
.pill{border-radius:999px;background:#7FCCC4;color:#002F42;padding:2px 12px;font-size:.9rem;white-space:nowrap}.pill.w{background:#ffffff26;color:#fff}
.big-n{font-size:2.6rem;font-weight:600;line-height:1.1}
.mu{color:#9EC5DD}
.face{font-size:1.8rem}
@media(prefers-reduced-motion:reduce){.pr{transition:none}}
</style>
</head>
<body>
<div class="top"><button id="adv">Next patient goes in</button><button id="rst">Reset</button></div>
<main class="stage"><div class="ph" id="ph"></div></main>
<script>
const D={
hi:["Good morning, Asha","नमस्ते, आशा","ನಮಸ್ಕಾರ, ಆಶಾ"],
ahd:["ahead of you","आपके आगे","ನಿಮ್ಮ ಮುಂದೆ"],
mn:["about {m} min","लगभग {m} मिनट","ಸುಮಾರು {m} ನಿಮಿಷ"],
go:["Go in","अंदर जाएँ","ಒಳಗೆ ಹೋಗಿ"],
m4:["The doctor is finishing with the previous patient. Thank you for your patience.","डॉक्टर पिछले मरीज़ को देख रहे हैं। धैर्य के लिए धन्यवाद।","ವೈದ್ಯರು ಹಿಂದಿನ ರೋಗಿಯನ್ನು ನೋಡುತ್ತಿದ್ದಾರೆ. ತಾಳ್ಮೆಗೆ ಧನ್ಯವಾದಗಳು."],
m3:["Almost there. Please stay close to the waiting area.","बस थोड़ा और। कृपया प्रतीक्षा क्षेत्र के पास रहें।","ಇನ್ನು ಸ್ವಲ್ಪ ಹೊತ್ತು. ದಯವಿಟ್ಟು ಕಾಯುವ ಜಾಗದ ಹತ್ತಿರವೇ ಇರಿ."],
m1:["You're next. Please take a deep breath and get ready.","अगली बारी आपकी है। गहरी साँस लें और तैयार हो जाएँ।","ಮುಂದಿನ ಸರದಿ ನಿಮ್ಮದು. ಒಂದು ಆಳವಾದ ಉಸಿರು ತೆಗೆದುಕೊಂಡು ಸಿದ್ಧರಾಗಿ."],
m0:["It's your turn. Please go to Room 204.","आपकी बारी है। कृपया कमरा 204 में जाएँ।","ನಿಮ್ಮ ಸರದಿ. ದಯವಿಟ್ಟು ಕೊಠಡಿ 204 ಕ್ಕೆ ಹೋಗಿ."],
here:["I'm here","मैं यहाँ हूँ","ನಾನು ಇಲ್ಲಿದ್ದೇನೆ"],ci:["Checked in","चेक-इन हो गया","ಚೆಕ್-ಇನ್ ಆಗಿದೆ"],
help:["Ask a person","किसी से पूछें","ಯಾರನ್ನಾದರೂ ಕೇಳಿ"],
bkS:["Book","बुकिंग","ಬುಕ್"],rxS:["Prescriptions","दवाइयाँ","ಔಷಧಿಗಳು"],rpS:["Reports","रिपोर्ट","ವರದಿಗಳು"],
pay:["Pay","भुगतान","ಪಾವತಿ"],fb:["Feedback","प्रतिक्रिया","ಅಭಿಪ್ರಾಯ"],cl:["Clinics","क्लिनिक","ಕ್ಲಿನಿಕ್"],
back:["Back","वापस","ಹಿಂದೆ"],
bk:["Book an appointment","अपॉइंटमेंट बुक करें","ಅಪಾಯಿಂಟ್‌ಮೆಂಟ್ ಬುಕ್ ಮಾಡಿ"],
dp:["Department","विभाग","ವಿಭಾಗ"],
dps:[["General Medicine","जनरल मेडिसिन","ಸಾಮಾನ್ಯ ವೈದ್ಯಕೀಯ"],["Dermatology","त्वचा रोग","ಚರ್ಮರೋಗ"],["Cardiology","हृदय रोग","ಹೃದಯರೋಗ"]],
dy:["Day","दिन","ದಿನ"],tm:["Time","समय","ಸಮಯ"],
cf:["Confirm booking","बुकिंग पक्की करें","ಬುಕಿಂಗ್ ದೃಢೀಕರಿಸಿ"],
dn:["Booked. We'll remind you the day before.","बुक हो गया। एक दिन पहले याद दिलाएँगे।","ಬುಕ್ ಆಗಿದೆ. ಒಂದು ದಿನ ಮುಂಚೆ ನೆನಪಿಸುತ್ತೇವೆ."],
mo:["Morning","सुबह","ಬೆಳಿಗ್ಗೆ"],ni:["Night","रात","ರಾತ್ರಿ"],af:["after food","खाने के बाद","ಊಟದ ನಂತರ"],
dl:["{n} days left","{n} दिन बचे","{n} ದಿನ ಬಾಕಿ"],
rf:["Order refill","रिफ़िल मँगाएँ","ರೀಫಿಲ್ ಕೇಳಿ"],rd:["Refill requested","रिफ़िल का अनुरोध भेजा","ರೀಫಿಲ್ ವಿನಂತಿ ಕಳುಹಿಸಲಾಗಿದೆ"],
ry:["Ready","तैयार","ಸಿದ್ಧ"],pr:["Processing","प्रक्रिया में","ಸಿದ್ಧವಾಗುತ್ತಿದೆ"],
sh:["Share with doctor","डॉक्टर को भेजें","ವೈದ್ಯರಿಗೆ ಕಳುಹಿಸಿ"],
due:["To pay","देय राशि","ಪಾವತಿಸಬೇಕಾದ ಮೊತ್ತ"],co:["Consultation","परामर्श","ಸಮಾಲೋಚನೆ"],lb:["Lab tests","लैब जाँच","ಲ್ಯಾಬ್ ಪರೀಕ್ಷೆ"],
upi:["Pay with UPI","UPI से भुगतान","UPI ಮೂಲಕ ಪಾವತಿ"],cs:["Pay at the counter","काउंटर पर भुगतान","ಕೌಂಟರ್‌ನಲ್ಲಿ ಪಾವತಿ"],
fq:["How was your wait?","आपका इंतज़ार कैसा रहा?","ನಿಮ್ಮ ಕಾಯುವಿಕೆ ಹೇಗಿತ್ತು?"],
th:["Thank you. Your feedback reached us.","धन्यवाद, आपकी बात हम तक पहुँच गई।","ಧನ್ಯವಾದ, ನಿಮ್ಮ ಅಭಿಪ್ರಾಯ ತಲುಪಿದೆ."],
nr:["Nearby clinics","पास के क्लिनिक","ಹತ್ತಿರದ ಕ್ಲಿನಿಕ್‌ಗಳು"]};
const L=["en","hi","kn"],N=5;
const S={ahead:4,lang:0,v:"home",in:false,dept:0,day:0,slot:-1,booked:false,rx:[0,0],fb:-1,big:false};
const t=(k,r={})=>{let s=D[k][S.lang];for(const x in r)s=s.replace("{"+x+"}",r[x]);return s};
const say=()=>S.ahead>=4?t("m4"):S.ahead>=2?t("m3"):S.ahead===1?t("m1"):t("m0");
const chips=(key,list,sel)=>`<div class="ch">${list.map((x,i)=>`<button data-c="${key}" data-i="${i}" aria-pressed="${sel===i}">${x}</button>`).join("")}</div>`;
const docs=["Dr. Mehta","Dr. Rao","Dr. Nair"],days=["Mon 26","Tue 27","Wed 28"],slots=["9:30","10:00","11:15"];
const meds=[["Paracetamol 500 mg",5],["Vitamin D3 60k IU",3]];

function screen(){
  const a=S.ahead;
  switch(S.v){
  case "home":{const C=2*Math.PI*94;
    return `<div class="rw"><svg viewBox="0 0 210 210"><circle class="tr" cx="105" cy="105" r="94"/><circle class="pr" cx="105" cy="105" r="94" stroke-dasharray="${C}" stroke-dashoffset="${C*a/N}"/></svg><div class="mid">${a?`<b>${a}</b><span>${t("ahd")}</span><span>${t("mn",{m:a*4})}</span>`:`<b style="font-size:2.6rem">${t("go")}</b>`}</div></div>
    <div class="bub" aria-live="polite">${say()}</div>
    <div class="row"><button class="btn" ${S.in?"disabled":""} data-a="in">${S.in?"✓ "+t("ci"):t("here")}</button><button class="btn o">${t("help")}</button></div>
    <div class="tiles"><button class="tile k" data-v="book"><i>📅</i>${t("bkS")}</button><button class="tile" data-v="rx"><i>💊</i>${t("rxS")}</button><button class="tile" data-v="rep"><i>🧪</i>${t("rpS")}</button><button class="tile" data-v="pay"><i>₹</i>${t("pay")}</button><button class="tile" data-v="fb"><i>💬</i>${t("fb")}</button><button class="tile" data-v="cl"><i>📍</i>${t("cl")}</button></div>`}
  case "book":
    if(S.booked)return `<h2>${t("bk")}</h2><div class="card"><div class="big-n">${days[S.day]} · ${slots[S.slot]}</div><p>${docs[S.dept]} · ${D.dps[S.dept][S.lang]}</p></div><div class="bub">${t("dn")}</div>`;
    return `<h2>${t("bk")}</h2><div class="card"><b>${t("dp")}</b>${chips("dept",D.dps.map(x=>x[S.lang]),S.dept)}<p class="mu" style="margin:-4px 0 10px">${docs[S.dept]}</p><b>${t("dy")}</b>${chips("day",days,S.day)}<b>${t("tm")}</b>${chips("slot",slots,S.slot)}</div><div class="row"><button class="btn" data-a="bk" ${S.slot<0?"disabled":""}>${t("cf")}</button></div>`;
  case "rx":return `<h2>${t("rxS")}</h2>`+meds.map((m,i)=>`<div class="card"><b>${m[0]}</b><p class="mu">${t("mo")} · ${t("ni")} · ${t("af")}</p><div class="ln"><span class="pill">${t("dl",{n:m[1]})}</span><button class="btn ${S.rx[i]?"":"o"}" style="flex:none" data-r="${i}" ${S.rx[i]?"disabled":""}>${S.rx[i]?t("rd"):t("rf")}</button></div></div>`).join("");
  case "rep":return `<h2>${t("rpS")}</h2><div class="card">${[["Blood test",1],["X-ray",0],["ECG",1]].map(r=>`<div class="ln"><b>${r[0]}</b><span class="pill ${r[1]?"":"w"}">${r[1]?t("ry"):t("pr")}</span></div>`).join("")}</div><div class="row"><button class="btn">${t("sh")}</button></div>`;
  case "pay":return `<h2>${t("pay")}</h2><div class="card"><span class="mu">${t("due")}</span><div class="big-n">₹1,700</div><div class="ln"><span>${t("co")}</span><b>₹500</b></div><div class="ln"><span>${t("lb")}</span><b>₹1,200</b></div></div><div class="row" style="flex-direction:column"><button class="btn">${t("upi")}</button><button class="btn o">${t("cs")}</button></div>`;
  case "fb":return `<h2>${t("fb")}</h2><div class="card"><p>${S.fb<0?t("fq"):t("th")}</p>${S.fb<0?`<div class="ch">${["😞","😐","🙂"].map((f,i)=>`<button class="face" data-f="${i}" aria-label="${i+1}/3">${f}</button>`).join("")}</div>`:""}</div>`;
  default:return `<h2>${t("nr")}</h2><div class="card"><div class="ln"><b>Heal Clinic · Indiranagar</b><span class="mu">1.2 km</span></div><div class="ln"><b>Heal Clinic · Jayanagar</b><span class="mu">3.4 km</span></div></div>`}
}
function render(){
  document.documentElement.lang=L[S.lang];
  const p=document.getElementById("ph");p.className="ph"+(S.big?" big":"");
  p.innerHTML=`<div class="hd"><b>${S.v==="home"?t("hi"):""}</b><div class="lg">${["EN","हि","ಕ"].map((n,i)=>`<button data-l="${i}" aria-pressed="${S.lang===i}">${n}</button>`).join("")}<button data-a="big" aria-pressed="${S.big}" aria-label="Larger text">Aa</button></div></div><div class="sc">${S.v==="home"?"":`<button class="bk" data-v="home">← ${t("back")}</button>`}${screen()}</div>`;
}
document.body.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.l)S.lang=+d.l;else if(d.v)S.v=d.v;else if(d.c){S[d.c]=+d.i;if(d.c==="dept")S.slot=-1}
  else if(d.r)S.rx[+d.r]=1;else if(d.f)S.fb=+d.f;
  else if(d.a==="bk")S.booked=true;else if(d.a==="in")S.in=true;else if(d.a==="big")S.big=!S.big;
  else if(b.id==="adv"){if(S.ahead>0)S.ahead--}
  else if(b.id==="rst")Object.assign(S,{ahead:4,v:"home",in:false,slot:-1,booked:false,rx:[0,0],fb:-1});
  else return;
  render();
});
render();
</script>
</body>
</html>
