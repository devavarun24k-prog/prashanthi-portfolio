<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heal Queue — Opening (Variation 2)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
<style>
:root{--bg:#DCEBF4;--ink:#002F42;--mute:#3f6577;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071b24;--ink:#dcebf4;--mute:#9EC5DD}}
:root[data-theme="dark"]{--bg:#071b24;--ink:#dcebf4;--mute:#9EC5DD}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Outfit,system-ui,"Noto Sans Devanagari","Noto Sans Kannada",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #7FCCC4;outline-offset:2px}
.top{display:flex;justify-content:center;padding:20px 16px 0}
.top button{border:1px solid var(--mute);background:none;border-radius:999px;padding:8px 18px;min-height:44px}
.stage{display:flex;justify-content:center;padding:20px 16px 48px}
.ph{width:100%;max-width:380px;height:740px;border-radius:38px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(175deg,#002F42 0%,#005E85 70%,#153579 100%);color:#fff;box-shadow:0 24px 50px -28px #000a}
/* splash */
.sp{flex:1;border:0;background:none;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
.rg{position:relative;width:200px;height:200px}
.rg svg{width:100%;height:100%;transform:rotate(-90deg)}
circle{fill:none;stroke-width:12;stroke-linecap:round}
.tr{stroke:#ffffff26}
.pr{stroke:#7FCCC4;stroke-dasharray:553;stroke-dashoffset:553;animation:fill 2s cubic-bezier(.5,0,.2,1) .3s forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.rg b{position:absolute;inset:0;display:grid;place-content:center;font-size:3.4rem;font-weight:600;opacity:0;animation:in .6s ease 1.9s forwards}
.wm{opacity:0;animation:in .7s ease 2.1s forwards}
.wm h1{margin:0;font-size:2.5rem;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.wm p{margin:8px 0 0;color:#9EC5DD;font-size:1.1rem}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.pr{animation:none;stroke-dashoffset:0}.rg b,.wm{animation:none;opacity:1}}
/* welcome */
.sc{flex:1;overflow:auto;padding:22px 20px 24px}
.who{display:flex;align-items:center;gap:10px;color:#9EC5DD}
.av{width:38px;height:38px;border-radius:50%;background:#7FCCC4;color:#002F42;display:grid;place-content:center;font-weight:700}
.bub{background:#ffffff1c;border-radius:22px 22px 22px 6px;padding:16px 18px;margin:12px 0}
.bub h2{margin:0 0 6px;font-size:1.6rem;font-weight:600;line-height:1.15}
.bub p{margin:0;color:#dcebf4}
.lab{display:block;font-weight:600;margin:18px 2px 8px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.ch button{flex:1;border:2px solid #ffffff55;background:none;border-radius:999px;padding:8px 10px;min-height:48px;font-size:1.05rem}
.ch button[aria-pressed="true"]{background:#9EC5DD;border-color:#9EC5DD;color:#002F42;font-weight:600}
.pin{display:flex;background:#ffffff1c;border-radius:999px;border:2px solid #ffffff55;overflow:hidden;min-height:54px}
.pin span{display:grid;place-content:center;padding:0 16px;color:#9EC5DD;font-weight:600}
.pin input{flex:1;min-width:0;border:0;background:none;padding:0 16px 0 0;font-size:1.15rem;letter-spacing:.06em}
.pin input::placeholder{color:#ffffff77}
.btn{display:block;width:100%;border:0;background:#7FCCC4;color:#002F42;border-radius:999px;padding:15px;min-height:54px;font-weight:600;font-size:1.05rem;margin-top:14px}
.btn:disabled{background:#ffffff26;color:#dcebf4}
.ok{background:#7FCCC4;color:#002F42;border-radius:999px;padding:10px 18px;margin-top:12px;font-weight:600}
.as{margin:18px 4px 0;color:#9EC5DD;text-align:center}
</style>
</head>
<body>
<div class="top"><button id="rp">Replay opening</button></div>
<main class="stage"><div class="ph" id="ph"></div></main>
<script>
const D={
tag:["Less wait, better care.","कम इंतज़ार, बेहतर देखभाल।","ಕಡಿಮೆ ಕಾಯುವಿಕೆ, ಉತ್ತಮ ಆರೈಕೆ."],
wt:["Hello, welcome to Heal Queue","नमस्ते, हील क्यू में आपका स्वागत है","ನಮಸ್ಕಾರ, ಹೀಲ್ ಕ್ಯೂಗೆ ಸ್ವಾಗತ"],
ws:["I'll tell you where you are in line, help you book visits and keep your reports safe.","मैं बताऊँगा कि कतार में आप कहाँ हैं, विज़िट बुक करने और रिपोर्ट सहेजने में मदद करूँगा।","ಸರದಿಯಲ್ಲಿ ನೀವು ಎಲ್ಲಿದ್ದೀರಿ ಎಂದು ಹೇಳುತ್ತೇನೆ, ಭೇಟಿ ಬುಕ್ ಮಾಡಲು ಮತ್ತು ವರದಿಗಳನ್ನು ಸುರಕ್ಷಿತವಾಗಿಡಲು ಸಹಾಯ ಮಾಡುತ್ತೇನೆ."],
lg:["Choose your language","अपनी भाषा चुनें","ನಿಮ್ಮ ಭಾಷೆ ಆಯ್ಕೆಮಾಡಿ"],
mb:["Mobile number","मोबाइल नंबर","ಮೊಬೈಲ್ ಸಂಖ್ಯೆ"],
ct:["Continue","आगे बढ़ें","ಮುಂದುವರಿಸಿ"],
sent:["Code sent to +91 {n}","+91 {n} पर कोड भेजा गया","+91 {n} ಗೆ ಕೋಡ್ ಕಳುಹಿಸಲಾಗಿದೆ"],
as:["No smartphone? Ask at reception for a printed token.","स्मार्टफ़ोन नहीं है? रिसेप्शन पर छपा टोकन माँगें।","ಸ್ಮಾರ್ಟ್‌ಫೋನ್ ಇಲ್ಲವೇ? ಸ್ವಾಗತ ಕೌಂಟರ್‌ನಲ್ಲಿ ಮುದ್ರಿತ ಟೋಕನ್ ಕೇಳಿ."]};
const L=["en","hi","kn"],names=["English","हिन्दी","ಕನ್ನಡ"];
const S={scr:"splash",lang:0,num:"",sent:false};let timer;
const t=(k,r={})=>{let s=D[k][S.lang];for(const x in r)s=s.replace("{"+x+"}",r[x]);return s};
function render(){
  document.documentElement.lang=L[S.lang];
  const p=document.getElementById("ph");clearTimeout(timer);
  if(S.scr==="splash"){
    p.innerHTML=`<button class="sp" id="skip" aria-label="Heal Queue"><div class="rg"><svg viewBox="0 0 200 200"><circle class="tr" cx="100" cy="100" r="88"/><circle class="pr" cx="100" cy="100" r="88"/></svg><b>HQ</b></div><div class="wm"><h1>Heal Queue</h1><p>${t("tag")}</p></div></button>`;
    timer=setTimeout(()=>{S.scr="welcome";render()},4000);return}
  p.innerHTML=`<div class="sc"><div class="who"><div class="av">H</div><span>Heal Queue</span></div>
  <div class="bub"><h2>${t("wt")}</h2><p>${t("ws")}</p></div>
  <b class="lab">${t("lg")}</b><div class="ch">${names.map((n,i)=>`<button data-l="${i}" aria-pressed="${S.lang===i}">${n}</button>`).join("")}</div>
  <label class="lab" for="m">${t("mb")}</label><div class="pin"><span>+91</span><input id="m" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="${S.num}" placeholder="98765 43210"></div>
  ${S.sent?`<div class="ok" role="status">${t("sent",{n:S.num})}</div>`:""}
  <button class="btn" id="go" ${S.num.length===10?"":"disabled"}>${t("ct")}</button>
  <p class="as">${t("as")}</p></div>`;
  document.getElementById("m").oninput=e=>{S.num=e.target.value.replace(/\D/g,"");S.sent=false;e.target.value=S.num;document.getElementById("go").disabled=S.num.length!==10;const o=document.querySelector(".ok");if(o)o.remove()};
}
document.body.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="skip")S.scr="welcome";
  else if(b.id==="rp")Object.assign(S,{scr:"splash",num:"",sent:false});
  else if(b.dataset.l)S.lang=+b.dataset.l;
  else if(b.id==="go")S.sent=true;
  else return;
  render();
});
render();
</script>
</body>
</html>
